# Application stack. Rebuild on code deploy; leave infra (or wp_* DB) running.
# Cloud + broken bridge routing: api/worker use host network -> 127.0.0.1:5432/6379
# Usage: docker compose -p dating-app -f deploy/compose.app.yml --env-file .env up -d --build

name: dating-app

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
      network: host
    image: dating-api:local
    container_name: dating-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dating}:${POSTGRES_PASSWORD:-dating_dev_password}@${POSTGRES_HOST:-127.0.0.1}:5432/${POSTGRES_DB:-dating}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-http://minio:9000}
      OSS_PUBLIC_ENDPOINT: ${OSS_PUBLIC_ENDPOINT:-http://127.0.0.1:19000}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      OSS_BUCKET: ${OSS_BUCKET:-dating-media}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    image: dating-api:local
    container_name: dating-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dating}:${POSTGRES_PASSWORD:-dating_dev_password}@${POSTGRES_HOST:-127.0.0.1}:5432/${POSTGRES_DB:-dating}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
    depends_on:
      api:
        condition: service_healthy
    command: python -m workers.runner

  admin:
    build:
      context: ../../dating-admin-web
      dockerfile: Dockerfile.prod
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
      network: host
    image: dating-admin:local
    container_name: dating-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dating-net

  nginx:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    container_name: dating-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/dating.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - dating-net

networks:
  dating-net:
    name: dating-net
    external: true
